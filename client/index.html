<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#12100e" />
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23dd7a3b'/%3E%3Cpath d='M16 6c-4.4 0-8 3.5-8 7.9 0 5.6 8 12.1 8 12.1s8-6.5 8-12.1C24 9.5 20.4 6 16 6zm0 10.8a3 3 0 110-6 3 3 0 010 6z' fill='%23fff'/%3E%3C/svg%3E"
  />
  <title>Travel Planner 1.2.33</title>
  <script>
    /* Fija el tema antes de pintar para evitar el flash de tema claro.
       Por defecto oscuro; respeta la elección guardada (light/dark/system). */
    try {
      var t = localStorage.getItem("tp-theme") || "dark";
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
