services:
  - type: web
    name: dailytrip
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      # Render inyecta PORT automáticamente: NO lo definas aquí.
      # Evita que el postinstall de Playwright descargue navegadores en el build.
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "1"
      - key: NODE_VERSION
        value: "22"
      # Secreto: se rellena en el panel de Render (Environment), no en el repo.
      - key: GEOAPIFY_API_KEY
        sync: false
      # Opcional: respaldo de Google Places. Dejar vacío si no se usa.
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      # Opcional: curación por IA (Google Gemini). Aditivo; se rellena en el panel.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-flash-lite-latest"
      - key: APP_USER_AGENT
        value: "TravelPlannerPersonal/1.2.48 (personal-use)"
      - key: NOMINATIM_URL
        value: "https://nominatim.openstreetmap.org"
      - key: OSRM_URL
        value: "https://router.project-osrm.org"
      - key: OVERPASS_URL
        value: "https://overpass-api.de/api/interpreter"
      - key: DEBUG_EXTERNAL
        value: "0"
